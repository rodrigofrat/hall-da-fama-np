name: CI e deploy (GitHub Pages)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_DATA_MODE: ${{ vars.VITE_DATA_MODE || (vars.VITE_SUPABASE_URL && vars.VITE_SUPABASE_PUBLISHABLE_KEY && 'supabase') || 'demo' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_VIDEO_PAINEL_URL: ${{ vars.VITE_VIDEO_PAINEL_URL }}
      VITE_VIDEO_HALL_URL: ${{ vars.VITE_VIDEO_HALL_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-bundle.mjs dist ${{ env.VITE_DATA_MODE == 'demo' && '--allow-demo' || '' }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
