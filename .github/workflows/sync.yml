name: Sincronizar planilha com Supabase
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Somente validar, sem gravar'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sync-planilha
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      HALL_SPREADSHEET_ID: ${{ secrets.HALL_SPREADSHEET_ID }}
      PORTAL_AUX_SPREADSHEET_ID: ${{ secrets.PORTAL_AUX_SPREADSHEET_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sincronizar
        env:
          SYNC_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$SYNC_TRIGGER" = schedule ] && { [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$HALL_SPREADSHEET_ID" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; }; then
            echo 'Configuração de produção pendente. Nenhum dado foi lido.'
          elif [ "$DRY_RUN" = true ]; then
            npm run sync:dry
          else
            npm run sync
          fi
